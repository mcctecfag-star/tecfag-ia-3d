<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tecfag IA 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Manrope:wght@400;600;700&display=swap">
<style>
/* Sala 3D em tela cheia; atalhos de câmera embaixo do título; painel lateral translúcido com fichas e mural. Visual único escuro. */
:root {
  --bg: #0b1622;
  --glass: rgba(10, 22, 32, .8);
  --line: rgba(84, 214, 255, .2);
  --fg: #e6f1f5;
  --muted: #8aa6b2;
  --cyan: #54d6ff;
  --work: #e3b448;
  --wait: #ff8a5c;
  --meet: #b18cff;
  --ok: #5fe08f;
  --idle: #8ea3a8;
  --display: "Chakra Petch", "Segoe UI", sans-serif;
  --body: "Manrope", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: var(--body); overflow: hidden; }
#cena { position: fixed; inset: 0; }
#cena canvas { display: block; }

.topo { position: fixed; top: 16px; left: 16px; z-index: 5; display: grid; gap: 8px; max-width: calc(100vw - 400px); }
.topo h1 { font-family: var(--display); font-weight: 700; font-size: clamp(22px, 3vw, 32px); margin: 0; letter-spacing: .04em; }
.topo h1 span { color: var(--cyan); }
.resumo { font-family: var(--display); color: var(--muted); display: flex; gap: 14px; font-size: 14px; flex-wrap: wrap; }
.resumo b { color: var(--fg); }
.atalhos { display: flex; gap: 6px; flex-wrap: wrap; }
.atalhos button {
  font: 600 13px var(--display); letter-spacing: .04em; color: var(--fg); cursor: pointer;
  background: var(--glass); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px;
}
.atalhos button:hover, .atalhos button.ativo { border-color: var(--cyan); color: var(--cyan); }
.atalhos button:focus-visible, .painel-cab button:focus-visible, .ficha:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.demo { font-size: 12.5px; color: #f3dca0; background: rgba(58, 50, 32, .85); border: 1px solid #6b5a2c; border-radius: 6px; padding: 4px 10px; justify-self: start; }

.painel {
  position: fixed; top: 16px; right: 16px; bottom: 16px; width: 340px; z-index: 5;
  background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; overflow: hidden;
}
.painel-cab { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.painel-cab h2 { font: 600 14px var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0; }
.painel-cab button { background: none; border: 1px solid var(--line); color: var(--fg); border-radius: 6px; padding: 4px 10px; font: inherit; font-size: 13px; cursor: pointer; }
.rolagem { overflow-y: auto; padding: 12px 14px; display: grid; gap: 10px; align-content: start; }
.painel.fechado .rolagem { display: none; }
.painel.fechado { bottom: auto; }
.ficha {
  border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 4px;
  background: rgba(255,255,255,.02); cursor: pointer; text-align: left; color: inherit; font: inherit; width: 100%;
}
.ficha:hover, .ficha.sel { border-color: var(--cyan); background: rgba(84,214,255,.06); }
.ficha-topo { display: flex; gap: 10px; align-items: center; }
.bolinha { width: 12px; height: 12px; border-radius: 50%; flex: none; box-shadow: 0 0 10px currentColor; }
.nome { font-weight: 700; }
.cargo { color: var(--muted); font-size: 12.5px; }
.pill { justify-self: start; font: 12px var(--display); padding: 0 8px; border-radius: 999px; border: 1px solid currentColor; letter-spacing: .04em; }
.s-trabalhando { color: var(--work); } .s-esperando { color: var(--wait); } .s-reuniao { color: var(--meet); } .s-concluido { color: var(--ok); } .s-livre { color: var(--idle); }
.tarefa { font-size: 13.5px; overflow-wrap: anywhere; }
.quando { color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
h3 { font: 600 13px var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 8px 0 0; }
.mural { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.mural li { font-size: 13px; border-left: 2px solid var(--cyan); padding-left: 8px; display: grid; }
.mural .quem { font-weight: 700; }
.pedir { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 8px; }
.pedir textarea { width: 100%; min-height: 70px; resize: vertical; background: rgba(255,255,255,.04); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; font: inherit; font-size: 13.5px; }
.pedir textarea:focus-visible { outline: 2px solid var(--cyan); }
.pedir .linha { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.pedir button { font: 600 13px var(--display); color: #06131c; background: var(--cyan); border: 0; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
.pedir button.sec { background: none; color: var(--fg); border: 1px solid var(--line); }
.pedir button:disabled { opacity: .5; cursor: default; }
.pedir .info { color: var(--muted); font-size: 12.5px; }
.pedidos { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.pedidos li { font-size: 13px; display: grid; gap: 2px; border-left: 2px solid var(--idle); padding-left: 8px; }
.pedidos li.executando { border-color: var(--work); } .pedidos li.concluido { border-color: var(--ok); } .pedidos li.erro { border-color: var(--wait); }
.pedidos details { color: var(--muted); } .pedidos details p { white-space: pre-wrap; color: var(--fg); margin: 4px 0 0; max-height: 220px; overflow: auto; }
.dica { position: fixed; left: 16px; bottom: 16px; z-index: 5; color: var(--muted); font-size: 12.5px; pointer-events: none; }
.erro { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; z-index: 10; }
.rotulo {
  font: 600 12.5px var(--display); color: var(--fg); background: rgba(6, 14, 22, .82); border: 1px solid var(--line);
  border-radius: 4px; padding: 1px 8px; white-space: nowrap; pointer-events: none; display: flex; gap: 6px; align-items: center;
}
.rotulo i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; display: inline-block; }
.rotulo.sel { border-color: var(--cyan); }
.rotulo.local { font-size: 13px; letter-spacing: .1em; color: var(--cyan); border-color: var(--cyan); }
@media (max-width: 760px) {
  .topo { left: 12px; top: 12px; max-width: calc(100vw - 24px); }
  .painel { top: auto; left: 12px; right: 12px; bottom: 12px; width: auto; max-height: 40vh; }
  .painel.fechado { bottom: 12px; }
  .dica { display: none; }
}
</style>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

</head>
<body>
<div id="cena"></div>

<div class="topo">
  <h1>Tecfag <span>IA</span></h1>
  <div class="resumo" id="resumo"></div>
  <div class="atalhos" id="atalhos">
    <button type="button" data-vista="geral" class="ativo">Escritório</button>
    <button type="button" data-vista="ponto">Ponto</button>
    <button type="button" data-vista="reuniao">Sala de reunião</button>
    <button type="button" data-vista="copa">Copa</button>
  </div>
  <div class="demo" id="demo" hidden>Modo demonstração: status inventados só para mostrar a sala</div>
</div>

<aside class="painel" id="painel">
  <div class="painel-cab">
    <h2>Equipe</h2>
    <button id="btnPainel" type="button" aria-expanded="true">Recolher</button>
  </div>
  <div class="rolagem">
    <section class="pedir" id="pedir" hidden>
      <div class="linha"><strong>Pedir tarefa</strong><button type="button" class="sec" id="btnLogin">Entrar com Google</button></div>
      <div id="formPedido" hidden>
        <textarea id="textoPedido" maxlength="2000" placeholder="Ex.: Copy, faz 3 ganchos para o anúncio da seladora"></textarea>
        <div class="linha"><span class="info" id="infoPedido">Comece com o nome do agente.</span><button type="button" id="btnEnviar">Enviar</button></div>
        <ol class="pedidos" id="listaPedidos"></ol>
      </div>
      <span class="info" id="avisoPedido"></span>
    </section>
    <div id="fichas" style="display:grid;gap:10px"></div>
    <h3>Mural</h3>
    <ol class="mural" id="mural"></ol>
  </div>
</aside>

<div class="dica">Arraste para girar · role para aproximar · clique num boneco para focar</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const V = (x, y, z) => new THREE.Vector3(x, y, z);
const reduz = matchMedia('(prefers-reduced-motion: reduce)').matches;
const STATUS = { trabalhando: 'Trabalhando', esperando: 'Esperando você', reuniao: 'Em reunião', concluido: 'Concluído', livre: 'Livre' };
const COR_STATUS = { trabalhando: 0xe3b448, esperando: 0xff8a5c, reuniao: 0xb18cff, concluido: 0x5fe08f, livre: 0x8ea3a8 };
const hex6 = n => '#' + n.toString(16).padStart(6, '0');

// ---------- planta da sala ----------
// Mesas em 2 fileiras de 4. Corredor entre as fileiras (CORR_Z), corredor da frente (FRENTE_Z)
// e corredor lateral (CORR_X) que leva à sala de reunião e à copa, à direita.
const MESAS = [];
for (const z of [-3, 1.5]) for (const x of [-6, -3, 0, 3]) MESAS.push([x, z]);
const CORR_Z = -0.6, FRENTE_Z = 4.6, CORR_X = 5.2;
const PORTA = V(-11.6, 0, 5.6);
const PONTO = V(-9.6, 0, 4.75);      // onde a pessoa para; o totem fica em z 4.0
const CAFE_PE = V(7.6, 0, 1.9), SNACK_PE = V(10.4, 0, 1.9);
const ASSENTOS = [7.8, 8.6, 9.4, 10.2].map(x => ({ p: V(x, 0, -3.05), rot: Math.PI, frente: true }))
  .concat([7.8, 8.6, 9.4, 10.2].map(x => ({ p: V(x, 0, -5.55), rot: 0, frente: false })));

// ---------- relógio e expediente ----------
// Para testar: ?hora=07:59 (e opcional &dia=1 a 5). ?demo=1 mostra status de exemplo.
const qs = new URLSearchParams(location.search);
let deslocamento = 0;
if (qs.get('hora')) {
  const [hh, mm] = qs.get('hora').split(':').map(Number);
  const alvo = new Date(); alvo.setHours(hh || 0, mm || 0, 0, 0);
  if (qs.get('dia')) alvo.setDate(alvo.getDate() + (Number(qs.get('dia')) - alvo.getDay()));
  deslocamento = alvo - Date.now();
}
const DEMO = qs.get('demo') === '1';
if (DEMO) document.getElementById('demo').hidden = false;
const agoraReal = () => new Date(Date.now() + deslocamento);
const diaUtil = d => d.getDay() >= 1 && d.getDay() <= 5;
const noExpediente = d => diaUtil(d) && d.getHours() >= 8 && d.getHours() < 18;

// ---------- renderer ----------
const host = document.getElementById('cena');
let renderer;
try { renderer = new THREE.WebGLRenderer({ antialias: true }); }
catch (e) {
  document.body.insertAdjacentHTML('beforeend', '<div class="erro">Seu navegador não conseguiu abrir o 3D (WebGL). Tente abrir no Chrome ou Edge atualizado.</div>');
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.3;
host.appendChild(renderer.domElement);

const rotulos = new CSS2DRenderer();
rotulos.setSize(innerWidth, innerHeight);
Object.assign(rotulos.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none' });
host.appendChild(rotulos.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1622);
scene.fog = new THREE.Fog(0x0b1622, 24, 44);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 120);
camera.position.set(9, 11, 17);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.8, 0);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.47;
controls.minDistance = 3; controls.maxDistance = 30;

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.5, 0.5, 0.7));
composer.addPass(new OutputPass());

// ---------- luz ----------
const hemi = new THREE.HemisphereLight(0xd6eeff, 0x24384a, 1.7); scene.add(hemi);
const sol = new THREE.DirectionalLight(0xfff1dc, 1.9);
sol.position.set(6, 14, 8); sol.castShadow = true;
sol.shadow.mapSize.set(2048, 2048);
Object.assign(sol.shadow.camera, { left: -14, right: 14, top: 10, bottom: -10, far: 40 });
scene.add(sol);
const luminarias = [];
for (const z of [-3, 1.5]) for (const x of [-4.5, 1.5]) {
  const l = new THREE.PointLight(0xf2f8ff, 9, 9, 1.4); l.position.set(x, 3.6, z); scene.add(l); luminarias.push(l);
}
const luzReuniao = new THREE.PointLight(0xe8e0ff, 8, 8, 1.4); luzReuniao.position.set(9, 3.2, -4.3); scene.add(luzReuniao); luminarias.push(luzReuniao);
const luzCopa = new THREE.PointLight(0xffc98a, 8, 9, 1.4); luzCopa.position.set(9, 3, 3.5); scene.add(luzCopa); luminarias.push(luzCopa);
const luzPonto = new THREE.PointLight(0x54d6ff, 6, 5, 1.5); luzPonto.position.set(-9.6, 2.6, 4.6); scene.add(luzPonto);

// ---------- helpers ----------
const mat = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: .55, metalness: .1, ...o });
const neon = c => new THREE.MeshBasicMaterial({ color: c });
function box(w, h, d, m, x = 0, y = 0, z = 0, pai = scene) {
  const me = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
  me.position.set(x, y, z); me.castShadow = me.receiveShadow = true; pai.add(me); return me;
}
function cil(rt, rb, h, m, x, y, z, pai = scene, seg = 20) {
  const me = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), m);
  me.position.set(x, y, z); me.castShadow = me.receiveShadow = true; pai.add(me); return me;
}
function textura(w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  return { c, g: c.getContext('2d'), t };
}
function placaTexto(txt, cor, w = 512, h = 128, tam = 72) {
  const p = textura(w, h);
  p.g.fillStyle = cor; p.g.font = `700 ${tam}px Chakra Petch, sans-serif`;
  p.g.textAlign = 'center'; p.g.textBaseline = 'middle'; p.g.fillText(txt, w / 2, h / 2 + 4);
  return p;
}
function hash(s) { let h = 0; for (const ch of String(s)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return h; }
function corValida(c, padrao = '#54d6ff') { return /^#[0-9a-f]{6}$/i.test(c || '') ? c : padrao; }
function rotuloLocal(txt, x, y, z) {
  const d = document.createElement('div'); d.className = 'rotulo local'; d.textContent = txt;
  const o = new CSS2DObject(d); o.position.set(x, y, z); scene.add(o); return o;
}

// ---------- sala ----------
const piso = new THREE.Mesh(new THREE.PlaneGeometry(24, 15), mat(0x1a2d40, { roughness: .4, metalness: .35 }));
piso.rotation.x = -Math.PI / 2; piso.position.set(0, 0, .5); piso.receiveShadow = true; scene.add(piso);
const grade = new THREE.GridHelper(24, 48, 0x1f6f8b, 0x163a4a);
grade.material.transparent = true; grade.material.opacity = .4; grade.position.set(0, .003, .5); scene.add(grade);

const parede = mat(0x1c3046);
box(24, 4.6, .2, parede, 0, 2.3, -7.1);
box(.2, 4.6, 15, parede, -12.1, 2.3, .5);
box(24, .04, .04, neon(0x54d6ff), 0, .06, -6.98);
box(24, .04, .04, neon(0x54d6ff), 0, 4.0, -6.98);
box(.04, .04, 15, neon(0x54d6ff), -11.98, .06, .5);

// telão
const telao = textura(1024, 440);
const telaoMesh = new THREE.Mesh(new THREE.PlaneGeometry(6, 2.6), new THREE.MeshBasicMaterial({ map: telao.t }));
telaoMesh.position.set(-1.5, 2.4, -6.97); scene.add(telaoMesh);
box(6.2, 2.8, .08, mat(0x05090e, { metalness: .8 }), -1.5, 2.4, -7.02);

// jardim vertical na parede esquerda
{
  box(.12, 2.8, 5.6, mat(0x6b4a2f, { roughness: .8 }), -11.95, 2, -3.4);
  const n = 620, geo = new THREE.IcosahedronGeometry(.14, 0);
  const inst = new THREE.InstancedMesh(geo, mat(0xffffff, { flatShading: true, roughness: .9 }), n);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), cor = new THREE.Color();
  const verdes = [0x3f9a5a, 0x58b86b, 0x2f7f49, 0x6fc77a, 0x24663b];
  for (let i = 0; i < n; i++) {
    e.set(Math.random() * 3, Math.random() * 3, Math.random() * 3); q.setFromEuler(e);
    const s = .7 + Math.random() * .9;
    m4.compose(V(-11.82 + Math.random() * .12, .75 + Math.random() * 2.5, -6 + Math.random() * 5.2), q, V(s, s, s));
    inst.setMatrixAt(i, m4); inst.setColorAt(i, cor.setHex(verdes[i % verdes.length]));
  }
  inst.castShadow = true; scene.add(inst);
  const spot = new THREE.SpotLight(0xc8ffd8, 12, 7, .6, .6); spot.position.set(-9.5, 4, -3.4); spot.target.position.set(-12, 2, -3.4);
  scene.add(spot, spot.target);
}

function planta(x, z, s = 1, vaso = 0xdfe6e3, y = 0) {
  const g = new THREE.Group(); g.position.set(x, y, z); g.scale.setScalar(s);
  cil(.28, .2, .5, mat(vaso, { roughness: .4 }), 0, .25, 0, g);
  const anel = new THREE.Mesh(new THREE.TorusGeometry(.28, .012, 6, 32), neon(0x54d6ff)); anel.rotation.x = Math.PI / 2; anel.position.y = .5; g.add(anel);
  const verdes = [0x3f9a5a, 0x58b86b, 0x2f7f49, 0x6fc77a];
  const folhas = 9 + (hash(x * 10 + z) % 5);
  for (let i = 0; i < folhas; i++) {
    const f = new THREE.Mesh(new THREE.SphereGeometry(.3, 6, 4), mat(verdes[i % 4], { flatShading: true }));
    const a = i / folhas * Math.PI * 2, alt = .55 + (i % 3) * .22;
    f.scale.set(.32, 1, .1); f.position.set(Math.cos(a) * .14, alt + .3, Math.sin(a) * .14);
    f.rotation.set(Math.sin(a) * .7, -a, -Math.cos(a) * .7); f.castShadow = true; g.add(f);
  }
  scene.add(g); return g;
}
const plantas = [
  planta(-11.3, -6.4, 1.4, 0x22303a), planta(-11.3, 7.4, 1.3), planta(4.9, -6.4, 1.2),
  planta(-8.5, -6.5, 1.0, 0x22303a), planta(11.4, 7.4, 1.4, 0x22303a), planta(6.6, 7.4, 1.0),
  planta(11.2, -6.5, 1.0), planta(-8.6, 3.8, .9, 0x22303a)
];

// ---------- mesas ----------
const monitores = [];
MESAS.forEach(([x, z], i) => {
  const g = new THREE.Group(); g.position.set(x, 0, z); scene.add(g);
  box(1.8, .06, .85, mat(0x3a5468, { metalness: .4, roughness: .35 }), 0, .76, 0, g);
  box(1.8, .02, .02, neon(0x54d6ff), 0, .74, .43, g);
  box(.05, .74, .7, mat(0x101a24, { metalness: .6 }), -.85, .37, 0, g);
  box(.05, .74, .7, mat(0x101a24, { metalness: .6 }), .85, .37, 0, g);
  box(.08, .32, .08, mat(0x101a24), 0, .95, -.25, g);
  box(1, .6, .05, mat(0x05090e, { metalness: .8 }), 0, 1.38, -.27, g);
  const tex = textura(320, 190);
  const tela = new THREE.Mesh(new THREE.PlaneGeometry(.94, .55), new THREE.MeshBasicMaterial({ map: tex.t }));
  tela.position.set(0, 1.38, -.24); g.add(tela);

function simbolo(ch, cor) {
  const { g, t } = textura(128, 128);
  g.fillStyle = cor; g.beginPath(); g.arc(64, 64, 54, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#071018'; g.font = 'bold 80px Chakra Petch, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(ch, 64, 70);
  return new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true }));
}
function texturaTatuagem(pele, seed) {
  const { c, g, t } = textura(64, 128);
  g.fillStyle = pele; g.fillRect(0, 0, 64, 128);
  g.strokeStyle = 'rgba(20, 24, 32, .85)'; g.lineWidth = 3;
  const r = n => ((seed * 9301 + n * 49297) % 233280) / 233280;
  for (let i = 0; i < 5; i++) {
    g.beginPath(); const y = 20 + i * 20;
    g.moveTo(0, y); g.bezierCurveTo(16, y - 12 * r(i), 48, y + 12 * r(i + 3), 64, y); g.stroke();
  }
  g.beginPath(); g.arc(32, 64, 9, 0, Math.PI * 2); g.stroke();
  return t;
}

function statusVisto(a) {

}
function lugarDesejado(a, b, agora) {

  if (exp && b.lugar === 'fora' && agora < b.chegada) return 'fora';
  const st = statusVisto(a);
  if (st === 'trabalhando' || st === 'concluido') return 'cadeira';
  if (st === 'esperando') return 'pe';
  if (st === 'reuniao') return 'reuniao';
  // livre: alterna entre a mesa, o café e a máquina de snacks
  if (b.lugar === b.livreAlvo && agora > b.livreAte) {

function aplicar(dados) {
  const lista = (dados && Array.isArray(dados.agentes) ? dados.agentes : [])
    .filter(a => a && a.id)
    .map(a => ({ ...a, status: STATUS[a.status] ? a.status : 'livre', nome: String(a.nome || a.id) }))
    .slice(0, MESAS.length);
  const usadas = new Set();
  lista.forEach(a => { if (Number.isInteger(a.mesa) && a.mesa >= 0 && a.mesa < MESAS.length && !usadas.has(a.mesa)) usadas.add(a.mesa); else a.mesa = -1; });
  lista.forEach(a => { if (a.mesa === -1) { let i = 0; while (usadas.has(i)) i++; a.mesa = i; usadas.add(i); } });

  for (const [id, b] of bonecos) if (!lista.find(a => a.id === id)) { b.raiz.removeFromParent(); b.rot.element.remove(); bonecos.delete(id); }

  lista.forEach(a => {
    const antigo = equipe.find(x => x.id === a.id);
    let b = bonecos.get(a.id);
    const mudouVisual = antigo && JSON.stringify([antigo.aparencia, antigo.cor, antigo.genero]) !== JSON.stringify([a.aparencia, a.cor, a.genero]);
    if (b && mudouVisual) { const l = b.lugar; b.raiz.removeFromParent(); b.rot.element.remove(); bonecos.delete(a.id); b = null; a._lugar = l; }

    b.anel.material.color.setHex(COR_STATUS[st]);

function colocar(a, b, lugar) {

  b.raiz.position.copy(f.p); b.lugar = lugar; b.destino = null; b.passos = [];

const relogio = new THREE.Clock();
const tmp = new THREE.Vector3();
function pose(b, sentado, t, andando) {
  if (sentado) {
    b.corpo.position.y = -.24;
    b.pernaE.rotation.x = b.pernaD.rotation.x = -Math.PI / 2;
    const dig = b.digitando && !reduz;
    b.bracoE.rotation.x = -1.1 + (dig ? Math.sin(t * 14) * .12 : 0);
    b.bracoD.rotation.x = -1.1 + (dig ? Math.sin(t * 14 + 1.6) * .12 : 0);
  } else {

let expedienteAtual = null;
function checarExpediente() {

  const primeira = expedienteAtual === null;
  expedienteAtual = dentro;
  if (!primeira) {
    const agora = performance.now();
    equipe.forEach((a, i) => { const b = bonecos.get(a.id); if (!b) return; if (dentro) b.chegada = agora + i * 2500; else b.saida = agora + i * 2500; });

function atualizarBoneco(a, b, t, dt, agora) {
  const st = statusVisto(a);

  if (!b.passos.length) {
    const alvo = lugarDesejado(a, b, agora);
    if (alvo !== b.lugar) {
      if (b.lugar === 'fora') b.raiz.position.copy(PORTA);
      b.passos = rota(a, b.lugar, alvo);
      b.destino = alvo;
      if (!b.passos.length) { b.lugar = alvo; }

  }
  const visivel = !(b.lugar === 'fora' && !b.passos.length);
  b.raiz.visible = b.rot.visible = visivel;
  if (!visivel) return;

  b.digitando = st === 'trabalhando';
  b.copo.visible = b.item === 'cafe';
  b.pacote.visible = b.item === 'snack';

  if (b.passos.length) {
    b.holo.visible = false; b.rot.position.y = 2.0;
    const passo = b.passos[0];
    if (b.pausaAte) {
      pose(b, false, t, false); b.raiz.rotation.y = Math.PI;

      if (passo.pausa) { b.pausaAte = agora + passo.pausa; pontoFlash = agora + 1300; pontoNome = a.nome; return; }
      b.passos.shift();
      if (!b.passos.length) {
        b.lugar = b.destino;
        if (b.lugar === 'cafe' || b.lugar === 'snack') b.item = b.lugar;
        if (b.lugar === 'pe' || b.lugar === 'cadeira' || b.lugar === 'reuniao' || b.lugar === 'fora') b.item = null;
        const f = posFinal(a, b.lugar); if (f.rot !== null) b.raiz.rotation.y = f.rot;

  if (b.lugar === 'pe') b.raiz.rotation.y = Math.atan2(camera.position.x - f.p.x, camera.position.z - f.p.z) * (st === 'esperando' ? 1 : .3);
  pose(b, f.sentado, t, false);
  b.holo.visible = st !== 'livre';
  b.alerta.visible = st === 'esperando';
  b.ok.visible = st === 'concluido';
  b.anel.rotation.z = t * 1.5;
  b.holo.position.y = (f.sentado ? 1.72 : 2.0) + (reduz ? 0 : Math.sin(t * 2.4 + a.mesa) * .05);
  b.rot.position.y = f.sentado ? 2.05 : 2.32;
}

}
document.getElementById('atalhos').addEventListener('click', e => { const bt = e.target.closest('button'); if (bt) irPara(bt.dataset.vista); });

function loop() {
  const dt = Math.min(relogio.getDelta(), .05), t = relogio.elapsedTime, agora = performance.now();
  if (t - ultimaTela > .12) { checarExpediente(); desenharTelas(t); ultimaTela = t; }
  equipe.forEach(a => { const b = bonecos.get(a.id); if (b) atualizarBoneco(a, b, t, dt, agora); });
  const nivel = expedienteAtual === false ? .4 : 1;
  hemi.intensity += (1.7 * nivel - hemi.intensity) * .03;
  luminarias.forEach(l => { l.intensity += (9 * nivel - l.intensity) * .03; });

const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();

    const pt = document.createElement('div'); pt.className = 'quando';
    pt.textContent = 'Ponto hoje: entrada ' + (ponto.entrada || '—') + ' · saída ' + (ponto.saida || '—');
    const q = document.createElement('div'); q.className = 'quando'; q.textContent = a.atualizadoEm ? 'Atualizado ' + relativo(a.atualizadoEm) : '';
    f.append(topo, p, ta, pt, q);
    f.addEventListener('click', () => focar(a.id));
    fichas.appendChild(f);
  });
  if (!equipe.length) fichas.textContent = 'Nenhum agente no arquivo equipe.js ainda.';

  const res = document.getElementById('resumo'); res.replaceChildren();
  if (fora) res.textContent = 'Fora do expediente · seg a sex, 08:00 às 18:00';
  else [['trabalhando', 'trabalhando'], ['reuniao', 'em reunião'], ['esperando', 'esperando você'], ['livre', 'livres']].forEach(([k, rot]) => {
    const s = document.createElement('span'), b = document.createElement('b');
    b.textContent = equipe.filter(a => statusVisto(a) === k).length; s.append(b, ' ' + rot); res.appendChild(s);
  });

  const ol = document.getElementById('mural'); ol.replaceChildren();
  const registros = [];
  if (ponto.entrada) registros.push({ quem: 'Ponto', texto: 'Equipe bateu ponto de entrada às 08:00', quando: hojeAs(8) });
  if (ponto.saida) registros.push({ quem: 'Ponto', texto: 'Equipe bateu ponto de saída às 18:00', quando: hojeAs(18) });
  const itens = (dados && Array.isArray(dados.mural) ? dados.mural : []).concat(registros)
    .sort((a, b) => String(b.quando).localeCompare(String(a.quando))).slice(0, 12);
  if (!itens.length) { const li = document.createElement('li'); li.textContent = 'Sem atividade ainda.'; ol.appendChild(li); }
  itens.forEach(i => {
    const li = document.createElement('li');
    const q = document.createElement('span'); q.className = 'quem'; q.textContent = i.quem || 'Equipe';
    const t = document.createElement('span'); t.textContent = i.texto || '';
    const w = document.createElement('span'); w.className = 'quando'; w.textContent = relativo(i.quando);
    li.append(q, t, w); ol.appendChild(li);
  });
}

// ---------- dados ----------
// No computador (arquivo local) a sala lê equipe.js a cada 5 s, com o texto das tarefas.
// No site (GitHub) lê o Firebase ao vivo, só com os status, e mostra a caixa de pedidos.
const LOCAL = location.protocol === 'file:' || ['localhost', '127.0.0.1'].includes(location.hostname);
const temFirebase = !!(window.firebase && window.FIREBASE_CONFIG);

function iniciarFirebase() {
  firebase.initializeApp(window.FIREBASE_CONFIG);
  const db = firebase.database();
  db.ref('sala').on('value', snap => {
    const v = snap.val();
    if (v) aplicar({ agentes: (v.agentes || []).map(a => ({ ...a, tarefa: '' })), mural: v.mural || [] });
  }, () => carregarArquivo());

  // pedidos: só a conta dona consegue ler e gravar (regras do banco)
  const caixa = document.getElementById('pedir');
  const btnLogin = document.getElementById('btnLogin');
  const form = document.getElementById('formPedido');
  const aviso = document.getElementById('avisoPedido');
  const txt = document.getElementById('textoPedido');
  const btnEnviar = document.getElementById('btnEnviar');
  const info = document.getElementById('infoPedido');
  const lista = document.getElementById('listaPedidos');
  caixa.hidden = false;
  let desligar = null;
  const auth = firebase.auth();
  btnLogin.addEventListener('click', () => {
    if (auth.currentUser) auth.signOut();
    else auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e => { aviso.textContent = 'Não foi possível entrar: ' + e.message; });
  });
  auth.onAuthStateChanged(u => {
    if (desligar) { desligar(); desligar = null; }
    const dona = u && u.email === window.DONA_EMAIL;
    btnLogin.textContent = u ? 'Sair' : 'Entrar com Google';
    form.hidden = !dona;
    aviso.textContent = !u ? 'Entre com a conta da Tecfag para mandar pedidos.' : dona ? '' : 'Esta conta não pode mandar pedidos.';
    if (!dona) return;
    const q = db.ref('pedidos').orderByChild('criadoEm').limitToLast(8);
    const cb = q.on('value', snap => {
      const itens = []; snap.forEach(c => { itens.push({ id: c.key, ...c.val() }); });
      lista.replaceChildren();
      itens.reverse().forEach(p => {
        const li = document.createElement('li'); li.className = p.status;
        const t = document.createElement('span'); t.textContent = p.texto;
        const s = document.createElement('span'); s.className = 'quando';
        s.textContent = ({ novo: 'Na fila', executando: 'Em andamento', concluido: 'Concluído', erro: 'Deu erro' })[p.status] + ' · ' + relativo(p.criadoEm);
        li.append(t, s);
        if (p.resposta) {
          const d = document.createElement('details'); const sm = document.createElement('summary'); sm.textContent = 'Ver resposta';
          const pr = document.createElement('p'); pr.textContent = p.resposta; d.append(sm, pr); li.append(d);
        }
        lista.appendChild(li);
      });
    }, e => { aviso.textContent = 'Sem acesso aos pedidos: ' + e.message; });
    desligar = () => q.off('value', cb);
  });
  btnEnviar.addEventListener('click', async () => {
    const texto = txt.value.trim();
    if (!texto) { info.textContent = 'Escreva o pedido primeiro.'; return; }
    btnEnviar.disabled = true;
    try {
      await db.ref('pedidos').push({ texto, status: 'novo', criadoEm: new Date().toISOString(), de: auth.currentUser.email });
      txt.value = ''; info.textContent = 'Pedido enviado. Ele roda quando o computador da Tecfag estiver com a ponte ligada.';
    } catch (e) { info.textContent = 'Não foi enviado: ' + e.message; }
    btnEnviar.disabled = false;
  });
}

function carregarArquivo() {
  carregar();
  setInterval(carregar, 5000);
}

function carregar() {
  const s = document.createElement('script');
  s.src = 'equipe.js?t=' + Date.now();
  s.onload = () => { aplicar(window.EQUIPE); s.remove(); };
  s.onerror = () => { s.remove(); if (!equipe.length) document.getElementById('fichas').textContent = 'Não encontrei o arquivo equipe.js na mesma pasta desta página.'; };
  document.head.appendChild(s);
}
if (!LOCAL && temFirebase) iniciarFirebase(); else carregarArquivo();
loop();
</script>
